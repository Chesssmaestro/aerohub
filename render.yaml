services:
  - type: web
    name: aerohub
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: AEROHUB_SECRET_KEY
        generateValue: true
      - key: AEROHUB_STAFF_CODE
        sync: false
