services:
  - type: web
    name: aerohub
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      # Ключ подписи cookie-сессии. Render сгенерирует случайный и сохранит его.
      - key: AEROHUB_SECRET_KEY
        generateValue: true
      # Код приглашения для регистрации сотрудника — задать вручную в дашборде.
      - key: AEROHUB_STAFF_CODE
        sync: false
