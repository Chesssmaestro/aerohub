<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0B0D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>{% block title %}АЭРОХАБ{% endblock %}</title>
<script>
  /* Тема ставится до отрисовки, чтобы не было вспышки тёмного фона. Выбор хранится в браузере. */
  (function () {
    var theme = null;
    try { theme = localStorage.getItem('aero-theme'); } catch (e) {}
    if (theme === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
      document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F3F4F6');
    }
  })();
</script>
<script>
  /* Начальные «скрытые» состояния анимации включаются только при живом JS и без reduced-motion.
     Если motion.js или библиотеки не загрузились — класс снимается, контент виден сразу. */
  (function () {
    var root = document.documentElement;
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    root.classList.add('js-motion');
    document.addEventListener('DOMContentLoaded', function () {
      if (!window.AERO_MOTION) root.classList.remove('js-motion');
    });
    setTimeout(function () { if (!window.AERO_MOTION) root.classList.remove('js-motion'); }, 3000);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.css">
<link rel="stylesheet" href="{{ static('css/app.css') }}">
<link rel="icon" href="{{ static('img/favicon.svg') }}" type="image/svg+xml">
<link rel="icon" href="{{ static('img/favicon-32.png') }}" type="image/png" sizes="32x32">
<link rel="icon" href="{{ static('img/favicon-64.png') }}" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="{{ static('img/apple-touch-icon.png') }}">
</head>
<body{% if request.session.get('admin_id') %} class="is-impersonating"{% endif %}>
{% block body %}{% endblock %}
{% if request.session.get('admin_id') %}
<div class="imp-bar" role="status">
  <span>Вы в кабинете <b>{{ user.full_name if user else 'пользователя' }}</b>{% if user and user.company %} · {{ user.company.name }}{% endif %} — режим администратора</span>
  <form method="post" action="/admin/return">
    <button type="submit" class="btn btn-primary btn-sm">Вернуться в админку</button>
  </form>
</div>
{% endif %}
<script src="{{ static('js/nav.js') }}" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js" defer></script>
<script src="{{ static('js/motion.js') }}" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
